# Source for paths and evaluation settings.
# Relative paths are resolved from the repo root.

checkpoint: exports/yolo26m_best.pt        # source weights live beside the ONNX they produce
dataset_yaml: /ABSOLUTE/PATH/TO/Warp-D-yolo/dataset.yaml   # <-- edit this

imgsz: 640
opset: 17

# Identical settings for EVERY accuracy measurement (PyTorch, ONNX, TRT FP16, TRT INT8)
val:
  split: val        # must match a key in dataset.yaml; use the split your coursework reported on
  batch: 1          # matches the static 1x3x640x640 ONNX input
  rect: false       # no rectangular batching: same square letterbox as the exported model
  conf: 0.001       # standard low threshold for mAP computation
  iou: 0.7

results_dir: benchmarks/results   # JSON results (committed)
runs_dir: benchmarks/runs         # ultralytics scratch output (gitignored)
exports_dir: exports